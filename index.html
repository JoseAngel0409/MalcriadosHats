<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malcriados Hats</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body>
    <!-- Barra Superior -->
    <div class="top-bar">
        <span><i class="fa-solid fa-truck"></i> Envíos a todo México</span>
        <span><i class="fa-brands fa-whatsapp"></i> WhatsApp</span>
        <span><i class="fa-solid fa-lock"></i> Pago seguro</span>
    </div>

    <!-- Header -->
    <header id="main-header">
        <!-- LOGO (centrado) -->
        <div class="logo">
            <a href="#">
                <span class="marca">MALCRIADOS</span>
                <span class="producto">HATS</span>
            </a>
        </div>

        <!-- BARRA INFERIOR (menú + iconos) -->
        <div class="navbar">
            <button class="menu-toggle" aria-label="Abrir menú">
                <i class="fa-solid fa-bars"></i>
            </button>

            <nav>
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Tienda</a></li>
                    <li><a href="#">Colecciones</a></li>
                    <li><a href="#">Nosotros</a></li>
                    <li><a href="#">Contacto</a></li>
                </ul>
            </nav>

            <div class="icons">
                <a href="#" class="search-toggle"><i class="fa-solid fa-magnifying-glass"></i></a>
                <a href="#"><i class="fa-regular fa-heart"></i></a>
                <a href="#"><i class="fa-regular fa-user"></i></a>
                <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
            </div>
        </div>

        <!-- Buscador desplegable -->
        <div class="search-bar">
            <div class="container">
                <input type="text" placeholder="Buscar productos..." />
                <button><i class="fa-solid fa-search"></i></button>
            </div>
        </div>

        <!-- Menú móvil (fuera del header para superposición) -->
        <div class="mobile-menu">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Tienda</a></li>
                <li><a href="#">Colecciones</a></li>
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </div>
    </header>

    <!-- ===== CONTENIDO PRINCIPAL (ejemplo) ===== -->
    <main>
        <div style="height: 150vh; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #999;">
        </div>
    </main>

    <script src="menu.js"></script>
</body>
</html>
